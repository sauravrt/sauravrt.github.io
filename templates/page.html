{% extends "base.html" %}
{% block content %}
<article>
  {% if page.relative_path == "about.md" %}
  <h1 class="visually-hidden">{{ config.author }}</h1>
  {% else %}
  <h1>{{ page.title }}</h1>
  {% endif %}
  <div class="prose">{{ page.content | safe }}</div>
  {% include "partials/profile-links.html" %}
</article>
{% endblock content %}
