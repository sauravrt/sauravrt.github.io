{% extends "base.html" %}
{% block content %}
{% set posts = get_section(path='posts/_index.md') %}
<h1>{{ section.title }}</h1>
<div class="prose section-intro">{{ posts.content | safe }}</div>
{% if posts.pages %}
  {{ <entries pages={posts.pages} /> }}
{% else %}
  <p class="empty-state">No posts published yet.</p>
{% endif %}
{% endblock content %}
